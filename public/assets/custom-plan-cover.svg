<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eee5e9"/>
      <stop offset="100%" stop-color="#dfd3d8"/>
    </linearGradient>
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Configurator Mockup -->
  <g transform="translate(100, 40)" filter="url(#softShadow3)">
    <rect width="600" height="370" rx="24" fill="#ffffff" stroke="#a66c59" stroke-opacity="0.2" stroke-width="1.5"/>

    <text x="35" y="42" font-family="'Barlow', sans-serif" font-weight="700" font-size="16" fill="#000000">Interactive Custom Plan Configurator</text>
    <text x="35" y="60" font-family="'Barlow', sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">No rigid plans • Select exact deliverables • Instant proposal</text>

    <!-- Step Progress -->
    <g transform="translate(35, 75)">
      <rect width="90" height="26" rx="13" fill="#cf5c36"/>
      <text x="45" y="17" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="700" font-size="11" fill="#ffffff">1. Objective</text>

      <rect x="100" width="90" height="26" rx="13" fill="#efc88b" fill-opacity="0.4"/>
      <text x="145" y="17" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="600" font-size="11" fill="#a66c59">2. Features</text>

      <rect x="200" width="90" height="26" rx="13" fill="#eee5e9"/>
      <text x="245" y="17" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="600" font-size="11" fill="#7c7c7c">3. Add-ons</text>

      <rect x="300" width="90" height="26" rx="13" fill="#eee5e9"/>
      <text x="345" y="17" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="600" font-size="11" fill="#7c7c7c">4. Delivery</text>

      <rect x="400" width="90" height="26" rx="13" fill="#eee5e9"/>
      <text x="445" y="17" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="600" font-size="11" fill="#7c7c7c">5. Review</text>
    </g>

    <!-- Configurator Items Selection -->
    <g transform="translate(35, 120)">
      <rect width="255" height="90" rx="14" fill="#ffffff" stroke="#cf5c36" stroke-width="2"/>
      <text x="18" y="30" font-family="'Barlow', sans-serif" font-weight="700" font-size="13" fill="#000000">AI WhatsApp Router</text>
      <text x="18" y="48" font-family="'Barlow', sans-serif" font-size="11" fill="#7c7c7c">Autonomous lead intake & hand-off</text>
      <text x="18" y="74" font-family="'Barlow', sans-serif" font-weight="700" font-size="12" fill="#cf5c36">✓ INCLUDED</text>

      <rect x="275" width="255" height="90" rx="14" fill="#ffffff" stroke="#cf5c36" stroke-width="2"/>
      <text x="293" y="30" font-family="'Barlow', sans-serif" font-weight="700" font-size="13" fill="#000000">Sub-Second Web Portal</text>
      <text x="293" y="48" font-family="'Barlow', sans-serif" font-size="11" fill="#7c7c7c">Next.js/React responsive architecture</text>
      <text x="293" y="74" font-family="'Barlow', sans-serif" font-weight="700" font-size="12" fill="#cf5c36">✓ INCLUDED</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(35, 230)">
      <rect width="530" height="110" rx="16" fill="#eee5e9" fill-opacity="0.6"/>
      <text x="25" y="36" font-family="'Barlow', sans-serif" font-weight="700" font-size="14" fill="#000000">Configured Investment Scope: ₹35,000 - ₹75,000</text>
      <text x="25" y="58" font-family="'Barlow', sans-serif" font-size="12" fill="#7c7c7c">Includes 2-3 week sprint, custom knowledge ingestion, and WhatsApp hotline.</text>
      <rect x="25" y="72" width="180" height="26" rx="13" fill="#000000"/>
      <text x="115" y="89" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Generate Formal Proposal →</text>
    </g>
  </g>
</svg>
