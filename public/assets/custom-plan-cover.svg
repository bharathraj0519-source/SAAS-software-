<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f8"/>
      <stop offset="100%" stop-color="#eee5e9"/>
    </linearGradient>
    <filter id="cpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#cpBg)"/>

  <!-- Configurator Container -->
  <g transform="translate(90, 35)" filter="url(#cpShadow)">
    <rect width="620" height="380" rx="20" fill="#ffffff" stroke="#7c7c7c" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Header -->
    <text x="30" y="38" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="15" fill="#000000">Interactive Custom Plan Configurator</text>
    <text x="30" y="56" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">No rigid lock-in | Select exact deliverables | Real-time scope tally</text>

    <!-- Save 20% Annual Toggle Badge -->
    <rect x="480" y="22" width="110" height="26" rx="13" fill="#efc88b" fill-opacity="0.4" stroke="#a66c59" stroke-opacity="0.4"/>
    <text x="535" y="39" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#a66c59">ANNUAL: SAVE 20%</text>

    <!-- 4 Selectable Feature Blocks -->
    <g transform="translate(30, 75)">
      <!-- Feature 1: AI Chatbot (Selected) -->
      <rect width="270" height="75" rx="12" fill="#efc88b" fill-opacity="0.2" stroke="#cf5c36" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="10" fill="#cf5c36"/>
      <path d="M24 28l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="46" y="26" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#000000">AI Chatbot Plus Tier</text>
      <text x="46" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="10" fill="#7c7c7c">Lead capture, FAQs, WhatsApp bridge</text>
      <text x="46" y="60" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#cf5c36">INCLUDED [Rs 2,999/mo]</text>

      <!-- Feature 2: High-Performance Web Portal (Selected) -->
      <g transform="translate(290, 0)">
        <rect width="270" height="75" rx="12" fill="#efc88b" fill-opacity="0.2" stroke="#cf5c36" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="10" fill="#cf5c36"/>
        <path d="M24 28l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="26" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#000000">Custom Web Development</text>
        <text x="46" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="10" fill="#7c7c7c">React / Next.js, sub-second LCP</text>
        <text x="46" y="60" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#cf5c36">INCLUDED [Rs 35,000 Scope]</text>
      </g>

      <!-- Feature 3: Core SEO Suite (Selected) -->
      <g transform="translate(0, 85)">
        <rect width="270" height="75" rx="12" fill="#efc88b" fill-opacity="0.2" stroke="#cf5c36" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="10" fill="#cf5c36"/>
        <path d="M24 28l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="26" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#000000">SEO Growth &amp; IndexNow</text>
        <text x="46" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="10" fill="#7c7c7c">Google Maps rank &amp; telemetry</text>
        <text x="46" y="60" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#cf5c36">INCLUDED [Plus Tier]</text>
      </g>

      <!-- Feature 4: Cloud SLA (Optional Add-on) -->
      <g transform="translate(290, 85)">
        <rect width="270" height="75" rx="12" fill="#faf8f9" stroke="#eee5e9" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="10" fill="#ffffff" stroke="#7c7c7c" stroke-width="1.5"/>
        <text x="46" y="26" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#000000">Priority 24/7 SLA Support</text>
        <text x="46" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="10" fill="#7c7c7c">Guaranteed 1-hour response</text>
        <text x="46" y="60" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#7c7c7c">OPTIONAL ADD-ON</text>
      </g>
    </g>

    <!-- Calculation Footer Summary Bar -->
    <g transform="translate(30, 255)">
      <rect width="560" height="95" rx="14" fill="#faf8f9" stroke="#a66c59" stroke-opacity="0.25"/>
      <text x="25" y="36" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#000000">Configured Investment Scope: Rs 35,000 - Rs 75,000</text>
      <text x="25" y="58" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">Includes: AI Chatbot, Custom Web App, Core SEO &amp; WhatsApp Integration</text>
      <text x="25" y="78" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#10b981">Estimated Turnaround: 2-3 Weeks Sprint</text>

      <!-- Action Button -->
      <rect x="360" y="28" width="180" height="40" rx="20" fill="#cf5c36"/>
      <text x="450" y="53" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">Generate Formal Proposal</text>
    </g>
  </g>
</svg>
