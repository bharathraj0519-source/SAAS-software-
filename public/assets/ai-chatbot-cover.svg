<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eee5e9"/>
      <stop offset="100%" stop-color="#e2d8dd"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf5c36"/>
      <stop offset="100%" stop-color="#a66c59"/>
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf5c36"/>
      <stop offset="100%" stop-color="#b84f2e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.15" stroke="#7c7c7c" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Chat Mockup Window -->
  <g transform="translate(120, 45)" filter="url(#softShadow)">
    <rect width="560" height="360" rx="24" fill="#ffffff" stroke="#a66c59" stroke-opacity="0.2" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="560" height="60" rx="24" fill="#ffffff"/>
    <rect y="40" width="560" height="20" fill="#ffffff"/>
    <line x1="0" y1="60" x2="560" y2="60" stroke="#eee5e9" stroke-width="1.5"/>
    
    <!-- Bot Avatar -->
    <circle cx="45" cy="30" r="18" fill="url(#accentGrad)"/>
    <!-- Bot Icon -->
    <path d="M40 25h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H40a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z M45 21v4 M42 29h.01 M48 29h.01" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="75" y="27" font-family="'Barlow', sans-serif" font-weight="700" font-size="14" fill="#000000">BlazeByte Autonomous Assistant</text>
    <text x="75" y="42" font-family="'Barlow', sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">Online • Intelligent Lead Capture</text>
    
    <!-- Badge -->
    <rect x="440" y="20" width="95" height="22" rx="11" fill="#efc88b" fill-opacity="0.25"/>
    <text x="487" y="35" text-anchor="middle" font-family="'Barlow', sans-serif" font-weight="700" font-size="10" fill="#cf5c36">PRO TIER DEMO</text>

    <!-- Bot Message 1 -->
    <g transform="translate(30, 80)">
      <rect width="360" height="68" rx="16" fill="#eee5e9" fill-opacity="0.6"/>
      <text x="18" y="28" font-family="'Barlow', sans-serif" font-weight="600" font-size="13" fill="#000000">Hello! Welcome to BlazeByte Studio.</text>
      <text x="18" y="48" font-family="'Barlow', sans-serif" font-weight="400" font-size="12" fill="#7c7c7c">How can I assist your business growth today?</text>
    </g>

    <!-- User Message -->
    <g transform="translate(190, 165)">
      <rect width="340" height="52" rx="16" fill="url(#bubbleUser)"/>
      <text x="18" y="31" font-family="'Barlow', sans-serif" font-weight="500" font-size="13" fill="#ffffff">Can you automate our WhatsApp enquiries?</text>
    </g>

    <!-- Bot Message 2 -->
    <g transform="translate(30, 235)">
      <rect width="400" height="64" rx="16" fill="#eee5e9" fill-opacity="0.6"/>
      <text x="18" y="26" font-family="'Barlow', sans-serif" font-weight="600" font-size="13" fill="#000000">Yes! 1-click WhatsApp routing & lead sync.</text>
      <text x="18" y="46" font-family="'Barlow', sans-serif" font-weight="400" font-size="12" fill="#a66c59">Connected to +91 77087 95342 • Instant Hand-off</text>
    </g>

    <!-- Input Box Simulation -->
    <g transform="translate(30, 312)">
      <rect width="500" height="36" rx="12" fill="#eee5e9" stroke="#7c7c7c" stroke-opacity="0.3" stroke-width="1"/>
      <text x="15" y="23" font-family="'Barlow', sans-serif" font-size="12" fill="#7c7c7c">Ask about custom plans, timeline, or web development...</text>
      <circle cx="480" cy="18" r="12" fill="#cf5c36"/>
      <path d="M476 18l5-3v6z" fill="#ffffff"/>
    </g>
  </g>
</svg>
