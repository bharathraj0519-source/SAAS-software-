<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f8"/>
      <stop offset="100%" stop-color="#eee5e9"/>
    </linearGradient>
    <linearGradient id="botAvatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf5c36"/>
      <stop offset="100%" stop-color="#a66c59"/>
    </linearGradient>
    <linearGradient id="userMsgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf5c36"/>
      <stop offset="100%" stop-color="#b54a26"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#cbBg)"/>

  <!-- Chat Window Container -->
  <g transform="translate(100, 35)" filter="url(#cardShadow)">
    <rect width="600" height="380" rx="20" fill="#ffffff" stroke="#7c7c7c" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Chat Header -->
    <rect width="600" height="64" rx="20" fill="#ffffff"/>
    <rect y="40" width="600" height="24" fill="#ffffff"/>
    <line x1="0" y1="64" x2="600" y2="64" stroke="#eee5e9" stroke-width="1.5"/>

    <!-- Bot Avatar Icon -->
    <circle cx="44" cy="32" r="18" fill="url(#botAvatarGrad)"/>
    <path d="M38 32h12M44 26v12M39 28l10 8M49 28l-10 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Header Text -->
    <text x="74" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#000000">BlazeByte AI Assistant</text>
    <text x="74" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">Online | Autonomous Lead Capture &amp; FAQ Routing</text>

    <!-- WhatsApp Status Badge -->
    <rect x="440" y="20" width="136" height="24" rx="12" fill="#efc88b" fill-opacity="0.35" stroke="#a66c59" stroke-opacity="0.4"/>
    <circle cx="452" cy="32" r="4" fill="#10b981"/>
    <text x="462" y="36" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="10" fill="#000000">WhatsApp Active</text>

    <!-- Message 1: Bot Welcome -->
    <g transform="translate(25, 85)">
      <rect width="420" height="68" rx="14" fill="#f4f1f2" stroke="#eee5e9" stroke-width="1"/>
      <text x="16" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="12" fill="#000000">Hello! I am your 24/7 autonomous commercial AI assistant.</text>
      <text x="16" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="11" fill="#7c7c7c">Would you like a quote on custom web development or an AI chatbot?</text>
    </g>

    <!-- Message 2: User Inquiry -->
    <g transform="translate(195, 170)">
      <rect width="380" height="52" rx="14" fill="url(#userMsgGrad)"/>
      <text x="18" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="12" fill="#ffffff">We need a high-converting web app for our dining business.</text>
      <text x="18" y="40" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="10" fill="#efc88b">Timeline: 2-3 weeks</text>
    </g>

    <!-- Message 3: Bot Response with WhatsApp Hand-off -->
    <g transform="translate(25, 238)">
      <rect width="440" height="66" rx="14" fill="#f4f1f2" stroke="#eee5e9" stroke-width="1"/>
      <text x="16" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="12" fill="#000000">Understood! Our Blaze Cafe portfolio is ready for inspection.</text>
      <text x="16" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#cf5c36">Routing brief to WhatsApp architect (+91 77087 95342)...</text>
    </g>

    <!-- Input Bar -->
    <g transform="translate(25, 320)">
      <rect width="550" height="42" rx="21" fill="#faf8f9" stroke="#7c7c7c" stroke-opacity="0.25"/>
      <text x="20" y="26" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" fill="#7c7c7c">Type a query or select a quick action...</text>
      <circle cx="525" cy="21" r="14" fill="#cf5c36"/>
      <path d="M520 21l8-4-8-4v3l5 1-5 1z" fill="#ffffff"/>
    </g>
  </g>
</svg>
