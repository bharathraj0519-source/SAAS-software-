<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="seoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f8"/>
      <stop offset="100%" stop-color="#eee5e9"/>
    </linearGradient>
    <linearGradient id="seoChartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf5c36" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cf5c36" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="seoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#seoBg)"/>

  <!-- Analytics Container -->
  <g transform="translate(90, 35)" filter="url(#seoShadow)">
    <rect width="620" height="380" rx="20" fill="#ffffff" stroke="#7c7c7c" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Dashboard Top Bar -->
    <text x="30" y="38" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="15" fill="#000000">Organic Growth &amp; Core Web Vitals Telemetry</text>
    <text x="30" y="56" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#7c7c7c">Target: https://www.blazebyte.shop | IndexNow Protocol Active</text>

    <rect x="475" y="22" width="115" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="488" cy="35" r="3.5" fill="#10b981"/>
    <text x="498" y="39" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#065f46">HEALTH: 94/100</text>

    <!-- 3 Metric Cards Row -->
    <g transform="translate(30, 75)">
      <!-- Metric 1: Health -->
      <rect width="170" height="72" rx="12" fill="#faf8f9" stroke="#eee5e9"/>
      <text x="14" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="10" fill="#7c7c7c">SEARCH HEALTH</text>
      <text x="14" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#000000">94 / 100</text>
      <text x="110" y="50" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#10b981">+18.4%</text>

      <!-- Metric 2: LCP -->
      <g transform="translate(185, 0)">
        <rect width="180" height="72" rx="12" fill="#faf8f9" stroke="#eee5e9"/>
        <text x="14" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="10" fill="#7c7c7c">LARGEST CONTENTFUL PAINT</text>
        <text x="14" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#cf5c36">0.82s</text>
        <text x="95" y="50" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="10" fill="#10b981">Good (&lt;2.5s)</text>
      </g>

      <!-- Metric 3: Maps Ranking -->
      <g transform="translate(380, 0)">
        <rect width="180" height="72" rx="12" fill="#faf8f9" stroke="#eee5e9"/>
        <text x="14" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="10" fill="#7c7c7c">LOCAL 3-PACK RANK</text>
        <text x="14" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#a66c59">#1 Position</text>
      </g>
    </g>

    <!-- Chart Visualization Section -->
    <g transform="translate(30, 165)">
      <rect width="560" height="190" rx="14" fill="#faf8f9" stroke="#eee5e9"/>
      
      <!-- Chart grid lines -->
      <line x1="20" y1="40" x2="540" y2="40" stroke="#eee5e9" stroke-width="1"/>
      <line x1="20" y1="85" x2="540" y2="85" stroke="#eee5e9" stroke-width="1"/>
      <line x1="20" y1="130" x2="540" y2="130" stroke="#eee5e9" stroke-width="1"/>

      <!-- Area Chart Path -->
      <path d="M 30 140 Q 90 120 150 110 T 270 80 T 390 55 T 510 35 L 510 160 L 30 160 Z" fill="url(#seoChartGrad)"/>
      <path d="M 30 140 Q 90 120 150 110 T 270 80 T 390 55 T 510 35" fill="none" stroke="#cf5c36" stroke-width="3" stroke-linecap="round"/>

      <!-- Data Point Highlight -->
      <circle cx="510" cy="35" r="5" fill="#cf5c36"/>
      <circle cx="510" cy="35" r="9" fill="#cf5c36" fill-opacity="0.25"/>

      <!-- Organic Traffic Label -->
      <rect x="420" y="65" width="115" height="26" rx="6" fill="#000000"/>
      <text x="477" y="82" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#ffffff">+340% Impressions</text>

      <text x="30" y="24" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#000000">Organic Traffic Growth Trajectory (Last 90 Days)</text>
    </g>
  </g>
</svg>
